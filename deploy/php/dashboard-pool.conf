; Pool PHP-FPM khusus Dashboard Jaringan.
;
;   sudo cp deploy/php/dashboard-pool.conf /etc/php/8.4/fpm/pool.d/dashboard.conf
;   sudo systemctl restart php8.4-fpm
;
; Web berjalan sebagai pengguna "dashboard", bukan www-data dan bukan
; pengguna kolektor. Ekstensi snmp TIDAK diaktifkan untuk FPM: aplikasi web
; tidak pernah menghubungi perangkat jaringan.

[dashboard]
user = dashboard
group = dashboard

listen = /run/php/php8.4-fpm-dashboard.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = dynamic
pm.max_children = 12
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5
pm.max_requests = 500

; Permintaan yang macet diputus dan dicatat.
request_terminate_timeout = 60s
request_slowlog_timeout = 10s
slowlog = /var/log/php8.4-fpm-dashboard.slow.log

catch_workers_output = yes
clear_env = yes

php_admin_value[upload_max_filesize] = 8M
php_admin_value[post_max_size] = 12M
php_admin_value[memory_limit] = 256M
php_admin_flag[expose_php] = off
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /var/log/php8.4-fpm-dashboard.error.log
php_admin_value[open_basedir] = /srv/dashboard-jaringan/:/tmp/
php_admin_value[session.cookie_secure] = 1
php_admin_value[opcache.enable] = 1
php_admin_value[opcache.validate_timestamps] = 0
