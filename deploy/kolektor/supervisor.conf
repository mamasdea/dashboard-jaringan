; Kolektor monitoring sebagai layanan Supervisor (Linux).
;
;   sudo cp deploy/kolektor/supervisor.conf /etc/supervisor/conf.d/dashboard-kolektor.conf
;   sudo supervisorctl reread && sudo supervisorctl update
;
; Sesuaikan jalur, pengguna, dan numprocs. Kolektor adalah proses terpisah
; dari aplikasi web dan idealnya berjalan di host tersendiri di jaringan
; manajemen, dengan .env sendiri (lihat docs/PANDUAN-UJI-SWITCH.md).

[program:dashboard-kolektor]
; -d extension=snmp : ekstensi SNMP dimuat hanya untuk proses ini, tidak untuk web.
command=/usr/bin/php -d extension=snmp /srv/dashboard-kolektor/artisan monitoring:kolektor --jeda=5
directory=/srv/dashboard-kolektor
user=kolektor

; KONKURENSI: jumlah pemeriksaan yang berjalan bersamaan = numprocs.
; Tiap proses memeriksa satu endpoint pada satu waktu, dan klaim di database
; menjamin satu endpoint tidak diperiksa dua proses sekaligus.
; Mulai dari 1; naikkan hanya bila satu putaran tidak selesai dalam interval.
numprocs=1
process_name=%(program_name)s_%(process_num)02d

; MIBS kosong: OID numerik dipakai, berkas MIB tidak dimuat (tanpa peringatan).
; Direktori persisten net-snmp diarahkan ke tempat yang boleh ditulis pengguna kolektor.
environment=MIBS="",SNMP_PERSISTENT_DIR="/var/lib/dashboard-kolektor/snmp",SNMPCONFPATH="/var/lib/dashboard-kolektor/snmp"

autostart=true
autorestart=true
startsecs=5
stopsignal=TERM
stopwaitsecs=30

; Log kolektor hanya memuat ringkasan putaran, tidak pernah kredensial.
stdout_logfile=/var/log/dashboard-kolektor.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=5
redirect_stderr=true
