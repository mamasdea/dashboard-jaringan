# Dashboard Jaringan — situs nginx (Ubuntu).
#
#   sudo cp deploy/nginx/dashboard-jaringan.conf /etc/nginx/sites-available/dashboard-jaringan
#   sudo ln -s /etc/nginx/sites-available/dashboard-jaringan /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Ganti sebelum dipakai: NAMA_HOST, jalur sertifikat, dan daftar "allow".
# Selama daftar "allow" belum diisi, situs hanya menjawab dari server itu
# sendiri. Itu disengaja: jangan dibuka sebelum konfigurasi akses ditinjau
# (docs/CHECKLIST-DEPLOYMENT.md, bagian "Tinjauan akses").

# HTTP hanya mengalihkan ke HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name NAMA_HOST;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name NAMA_HOST;

    root /srv/dashboard-jaringan/public;
    index index.php;
    charset utf-8;

    # ---- Siapa yang boleh membuka aplikasi -------------------------------
    # Isi dengan jaringan intra yang memang perlu, satu baris per CIDR, mis.:
    #   allow 10.10.0.0/16;
    # Jangan menulis "allow all" dan jangan menghapus "deny all".
    allow 127.0.0.1;
    allow ::1;
    deny all;

    # ---- TLS -------------------------------------------------------------
    ssl_certificate     /etc/ssl/dashboard-jaringan/fullchain.pem;
    ssl_certificate_key /etc/ssl/dashboard-jaringan/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:dashboard_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Aktifkan HSTS setelah HTTPS terbukti berjalan untuk semua pengguna.
    # add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;

    server_tokens off;

    # Foto paling besar 5 MB, CSV impor kecil; sisanya ruang untuk formulir.
    client_max_body_size 12m;

    access_log /var/log/nginx/dashboard-jaringan.access.log;
    error_log  /var/log/nginx/dashboard-jaringan.error.log;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Health check hanya untuk server ini dan host pemantau.
    # Tambahkan "allow <IP host pemantau>;" bila ada.
    location = /up {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        try_files $uri /index.php?$query_string;
    }

    location = /kesehatan {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        try_files $uri /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Aset hasil build bernama unik; boleh disimpan lama di browser.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/php8.4-fpm-dashboard.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        # Ekspor PDF dan impor CSV dapat memakan beberapa detik.
        fastcgi_read_timeout 60s;
    }

    # Tidak ada berkas PHP lain yang boleh dijalankan, dan tidak ada berkas
    # tersembunyi (.env, .git) yang boleh dilayani.
    location ~ \.php$ { return 404; }
    location ~ /\.(?!well-known) { deny all; }
}
